<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AmberGuard</title>
<style>
  html,body{margin:0;height:100%;background:#0a0c10;color:#eef1f6;font:14px system-ui,sans-serif}
  .box{max-width:420px;margin:20vh auto;padding:24px;text-align:center}
  a{color:#f0a030}
  .btn{display:inline-block;margin-top:16px;padding:12px 20px;border-radius:10px;background:linear-gradient(135deg,#c47a18,#f0a030);color:#1a1208;text-decoration:none;font-weight:600}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:none}
  .hint{color:#8b93a7;font-size:12px;margin-top:12px;line-height:1.5}
</style>
</head>
<body>
<div class="box" id="gate">
  <h1 style="font-size:18px;margin:0 0 8px">AmberGuard</h1>
  <p style="color:#8b93a7;margin:0">双频守护面板</p>
  <a class="btn" id="open" href="http://127.0.0.1:8080/">打开面板</a>
  <p class="hint">若 daemon 未启动，请确认模块已启用并重启后等待 service 拉起。<br>目标：http://127.0.0.1:8080/</p>
</div>
<iframe id="frame" title="AmberGuard"></iframe>
<script>
(function () {
  var url = "http://127.0.0.1:8080/";
  // 探测 daemon 是否在线；在线则 iframe 全屏嵌入（KSU WebUI 内更稳）
  fetch(url + "api/status", { cache: "no-store", mode: "cors" })
    .then(function (r) {
      if (!r.ok) throw new Error("bad");
      document.getElementById("gate").style.display = "none";
      var f = document.getElementById("frame");
      f.style.display = "block";
      f.src = url;
    })
    .catch(function () {
      // 保留「打开面板」按钮；部分 WebView 禁跨源 fetch 时用户可点链接
      document.getElementById("open").href = url;
    });
})();
</script>
</body>
</html>
