<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AmberGuard</title>
<style>
html,body{margin:0;height:100%;background:#0a0c10;overflow:hidden;font:14px system-ui,sans-serif}
#gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8b93a7;text-align:center;padding:24px;z-index:2}
.btn{display:inline-block;margin-top:14px;padding:12px 20px;border-radius:10px;background:linear-gradient(135deg,#c47a18,#f0a030);color:#1a1208;text-decoration:none;font-weight:600}
iframe{position:fixed;inset:0;border:0;width:100%;height:100%;background:#0a0c10}
.hint{font-size:12px;margin-top:10px;line-height:1.5;color:#5c6578}
</style>
</head>
<body>
<div id="gate">
  <div>正在打开面板…</div>
  <a class="btn" id="open" href="http://127.0.0.1:8080/">若未自动跳转请点这里</a>
  <p class="hint">面板由本机守护进程提供<br>http://127.0.0.1:8080/</p>
</div>
<iframe id="f" title="AmberGuard" src="about:blank"></iframe>
<script>
(function () {
  var url = "http://127.0.0.1:8080/";
  // 不做 fetch 探测：KSU WebView 对跨源 CORS 常挂起，表现为一直「连接中」
  // 1) 优先整页跳转（多数 WebUI 宿主允许）
  // 2) 同时塞 iframe 兜底
  try {
    var f = document.getElementById("f");
    f.src = url;
    f.onload = function () {
      document.getElementById("gate").style.display = "none";
      f.style.zIndex = "1";
    };
  } catch (e) {}
  setTimeout(function () {
    // 仍停在 gate：尝试 location 跳转
    try { location.replace(url); } catch (e2) {}
  }, 600);
})();
</script>
</body>
</html>
