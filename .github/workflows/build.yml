name: Build Magisk Module

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'web/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ANDROID_PLATFORM: android-24

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build daemon
        working-directory: daemon
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a build --release --bin amberguard

      - name: Copy binary
        run: |
          mkdir -p out/jniLibs/arm64-v8a
          cp daemon/target/aarch64-linux-android/release/amberguard out/jniLibs/arm64-v8a/amberguard

      - name: Strip binary
        run: |
          ndk="${{ steps.setup-ndk.outputs.ndk-path }}"
          "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-all out/jniLibs/arm64-v8a/amberguard

      - name: Check size
        run: |
          size=$(stat -c%s out/jniLibs/arm64-v8a/amberguard)
          echo "Binary size: $size bytes ($(( size / 1024 )) KB)"
          if [ "$size" -gt 1258291 ]; then echo "WARNING: over 1.2MB target"; fi

      # 关键：不 Compress-Archive，直接上传模块目录。
      # GitHub Artifact 下载后解压一次，根目录就是 Magisk 模块内容（module.prop 等）。
      # 手机上再 zip 一次刷入，或用 Magisk 从本地文件安装前自行打包。
      - name: Stage Magisk module tree
        run: |
          set -e
          rm -rf zip_root
          mkdir -p zip_root/system/bin
          cp out/jniLibs/arm64-v8a/amberguard zip_root/system/bin/amberguard
          chmod 755 zip_root/system/bin/amberguard
          for f in module.prop post-fs-data.sh service.sh sepolicy.rule customize.sh uninstall.sh; do
            [ -f "$f" ] && cp "$f" zip_root/
          done
          # 不打包 system.prop（避免 ro.* 环境指纹）；若日后确需再按需加入
          # KSU WebUI / MMRL 入口
          if [ -d webroot ]; then
            cp -a webroot zip_root/
          fi
          [ -d META-INF ] && cp -a META-INF zip_root/
          # 额外打一份可直接刷的 Magisk zip（单层，根目录无父目录）
          (cd zip_root && zip -r -9 ../AmberGuard-magisk.zip .)
          ls -la zip_root/
          ls -la AmberGuard-magisk.zip
          unzip -l AmberGuard-magisk.zip | head -30

      # 上传「模块目录」：下载 Artifact 解压一次 = 模块文件树
      - name: Upload module tree
        uses: actions/upload-artifact@v4
        with:
          name: AmberGuard-module-tree
          path: zip_root/
          if-no-files-found: error

      # 上传「可刷 zip」：下载 Artifact 解压一次 = 得到 AmberGuard-magisk.zip，再刷这个
      - name: Upload Magisk zip
        uses: actions/upload-artifact@v4
        with:
          name: AmberGuard-magisk-zip
          path: AmberGuard-magisk.zip
          if-no-files-found: error
