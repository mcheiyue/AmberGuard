<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AmberGuard</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--fg:#e8eaed;--muted:#9aa0a6;--ok:#34a853;--warn:#fbbc04;--bad:#ea4335;--line:#2a2f3a;--acc:#8ab4f8}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:18px;font-weight:600}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--muted)}
.badge.ok{background:#14301f;color:var(--ok)}
.badge.bad{background:#3a1515;color:var(--bad)}
.badge.warn{background:#3a3010;color:var(--warn)}
main{padding:16px 20px;display:grid;gap:12px;max-width:720px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h2{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:500}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.k{color:var(--muted)}
.v{font-variant-numeric:tabular-nums;text-align:right;word-break:break-all}
.note{color:var(--muted);font-size:12px;margin-top:8px}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:1.2em}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{background:var(--line);color:var(--fg);border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.primary{background:#1a3a5c;color:var(--acc)}
button:active{opacity:.85}
pre{margin:0;white-space:pre-wrap;word-break:break-all;font:12px/1.45 ui-monospace,Consolas,monospace;color:var(--muted);max-height:200px;overflow:auto}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--ok);width:0%;transition:width .3s}
</style>
</head>
<body>
<header>
  <h1>AmberGuard <span style="color:var(--muted);font-weight:400;font-size:13px">日用双频守护</span></h1>
  <span id="conn" class="badge">连接中…</span>
</header>
<main>
  <section class="card">
    <h2>当前连接</h2>
    <div class="row"><span class="k">SSID</span><span class="v" id="ssid">—</span></div>
    <div class="row"><span class="k">频段</span><span class="v" id="band">—</span></div>
    <div class="row"><span class="k">RSSI</span><span class="v" id="rssi">—</span></div>
    <div class="row"><span class="k">wpa 状态</span><span class="v" id="wpa_state">—</span></div>
    <div class="bar"><i id="hbar"></i></div>
    <p class="note">健康度 <span id="health">—</span> · 状态机 <span id="sm">—</span></p>
    <p class="err" id="err"></p>
  </section>
  <section class="card">
    <h2>模式</h2>
    <div class="btns">
      <button class="primary" onclick="mode('daily')">日用（自动切换）</button>
      <button onclick="mode('pause')">暂停守护</button>
    </div>
    <p class="note">异名双频需在系统设置里<strong>分别保存</strong> 5G 与 2.4G（如 MERCURY_C8B5）。未保存时无法 SELECT 下切。</p>
  </section>
  <section class="card">
    <h2>原始 JSON</h2>
    <pre id="raw">等待…</pre>
    <p class="note">2s 轮询 · 127.0.0.1:8080</p>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
async function mode(m) {
  try {
    await fetch('/api/mode/' + m, { method: 'GET', cache: 'no-store' });
    tick();
  } catch (e) { $('err').textContent = e.message; }
}
async function tick() {
  try {
    const r = await fetch('/api/status', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    $('conn').textContent = '已连接';
    $('conn').className = 'badge ok';
    $('ssid').textContent = j.ssid || '—';
    $('band').textContent = j.band === '5' ? '5 GHz' : (j.band === '2.4' ? '2.4 GHz' : (j.band || '—'));
    $('rssi').textContent = (j.rssi != null ? j.rssi + ' dBm' : '—');
    $('wpa_state').textContent = j.state || '—';
    const sc = typeof j.score === 'number' ? j.score : 0;
    $('health').textContent = sc.toFixed(0);
    $('hbar').style.width = Math.max(0, Math.min(100, sc)) + '%';
    $('hbar').style.background = sc < 30 ? 'var(--bad)' : sc < 70 ? 'var(--warn)' : 'var(--ok)';
    $('sm').textContent = j.power_state || '—';
    $('err').textContent = j.last_error || '';
    if (j.power_state === 'PAUSE') {
      $('conn').textContent = '已暂停';
      $('conn').className = 'badge warn';
    }
    $('raw').textContent = JSON.stringify(j, null, 2);
  } catch (e) {
    $('conn').textContent = '离线';
    $('conn').className = 'badge bad';
    $('raw').textContent = '拉取失败: ' + e.message;
  }
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
