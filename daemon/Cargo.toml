[package]
name = "amberguard"
version = "0.5.18"
edition = "2021"
description = "AmberGuard WiFi dual-band smart switch daemon"
license = "MIT"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
log = "0.4"

# Unix 套接字 / 系统调用；Windows 宿主仅做骨架编译与 HTTP 联调
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["socket", "uio", "fs", "poll"] }

[features]
default = []
# Phase 2+：nl80211 GET_STATION；当前仅占位，不拉依赖
neli = []

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"
