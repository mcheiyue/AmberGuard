<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AmberGuard Status</title>
<style>
  body { font-family: system-ui; margin: 20px; background: #111; color: #eee; }
  .status { background: #222; padding: 20px; border-radius: 8px; }
  .connected { color: #0f0; }
  .disconnected { color: #f80; }
  button { padding: 8px 16px; margin: 8px; }
</style>
</head>
<body>
<div class="status">
  <h1>AmberGuard Phase 1</h1>
  <div id="status">Loading...</div>
  <div id="score">Score: --</div>
  <div id="band">Band: --</div>
  <button onclick="manualStatus()">Manual Poll</button>
  <button onclick="location.reload()">Refresh</button>
  <script>
    function update() {
      fetch('/api/status')
        .then(r => r.json())
        .then(s => {
          document.getElementById('status').innerHTML = `<span class="${s.state.toLowerCase()}">WiFi: ${s.state}</span>`;
          document.getElementById('score').innerHTML = `Health: ${s.score.toFixed(0)}`;
          document.getElementById('band').innerHTML = `Band: ${s.band}`;
        });
    }
    setInterval(update, 1000);
    update();
  </script>
</div>
</body>
</html>
